<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sports illustration 1: an original picture drawn for The Daily Web from simple shapes (no outside
  source, so it is free to use). The seed (scripts/seed.js) uses it for sports articles.
  Size 800x450 (16:9) like the photos it replaced; the background is the category colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Sports illustration 1">
  <rect width="800" height="450" fill="#c2570c"/>
  <rect x="0" y="330" width="800" height="120" fill="#000" opacity=".12"/>
  <circle cx="400" cy="225" r="140" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><polygon points="400,170 450,205 430,265 370,265 350,205" fill="#fff" opacity=".9"/>
     <path d="M400 170 V90 M450 205 L520 185 M430 265 L475 320 M370 265 L325 320 M350 205 L280 185" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
</svg>
