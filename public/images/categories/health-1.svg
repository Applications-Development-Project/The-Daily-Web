<?xml version="1.0" encoding="UTF-8"?>
<!--
  Health illustration 1: an original picture drawn for The Daily Web from simple shapes (no outside
  source, so it is free to use). The seed (scripts/seed.js) uses it for health articles.
  Size 800x450 (16:9) like the photos it replaced; the background is the category colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Health illustration 1">
  <rect width="800" height="450" fill="#b83280"/>
  <rect x="0" y="330" width="800" height="120" fill="#000" opacity=".12"/>
  <rect x="340" y="90" width="120" height="270" rx="20" fill="#fff" opacity=".95"/><rect x="265" y="165" width="270" height="120" rx="20" fill="#fff" opacity=".95"/>
     <circle cx="170" cy="120" r="14" fill="#fff" opacity=".5"/><circle cx="640" cy="330" r="18" fill="#fff" opacity=".5"/>
</svg>
