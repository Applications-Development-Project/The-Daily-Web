<?xml version="1.0" encoding="UTF-8"?>
<!--
  Science illustration 2: an original picture drawn for The Daily Web from simple shapes (no outside
  source, so it is free to use). The seed (scripts/seed.js) uses it for science articles.
  Size 800x450 (16:9) like the photos it replaced; the background is the category colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Science illustration 2">
  <rect width="800" height="450" fill="#3f51b5"/>
  <rect x="0" y="330" width="800" height="120" fill="#000" opacity=".12"/>
  <circle cx="400" cy="225" r="26" fill="#fff"/>
     <ellipse cx="400" cy="225" rx="170" ry="60" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
     <ellipse cx="400" cy="225" rx="170" ry="60" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85" transform="rotate(60 400 225)"/>
     <ellipse cx="400" cy="225" rx="170" ry="60" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".85" transform="rotate(120 400 225)"/>
</svg>
