<?xml version="1.0" encoding="UTF-8"?>
<!--
  Economy illustration 1: an original picture drawn for The Daily Web from simple shapes (no outside
  source, so it is free to use). The seed (scripts/seed.js) uses it for economy articles.
  Size 800x450 (16:9) like the photos it replaced; the background is the category colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Economy illustration 1">
  <rect width="800" height="450" fill="#1e7a46"/>
  <rect x="0" y="330" width="800" height="120" fill="#000" opacity=".12"/>
  <rect x="170" y="260" width="80" height="110" fill="#fff" opacity=".8"/><rect x="290" y="210" width="80" height="160" fill="#fff" opacity=".85"/>
     <rect x="410" y="160" width="80" height="210" fill="#fff" opacity=".9"/><rect x="530" y="100" width="80" height="270" fill="#fff"/>
     <polyline points="170,200 300,150 420,110 580,60" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
</svg>
