<?xml version="1.0" encoding="UTF-8"?>
<!--
  Health illustration 2: an original picture drawn for The Daily Web from simple shapes (no outside
  source, so it is free to use). The seed (scripts/seed.js) uses it for health articles.
  Size 800x450 (16:9) like the photos it replaced; the background is the category colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Health illustration 2">
  <rect width="800" height="450" fill="#b83280"/>
  <rect x="0" y="330" width="800" height="120" fill="#000" opacity=".12"/>
  <polyline points="90,240 250,240 300,150 360,330 420,190 470,240 710,240" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
     <circle cx="710" cy="240" r="14" fill="#fff"/><circle cx="90" cy="240" r="14" fill="#fff"/>
</svg>
