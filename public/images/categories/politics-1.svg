<?xml version="1.0" encoding="UTF-8"?>
<!--
  Politics illustration 1: an original picture drawn for The Daily Web from simple shapes (no outside
  source, so it is free to use). The seed (scripts/seed.js) uses it for politics articles.
  Size 800x450 (16:9) like the photos it replaced; the background is the category colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Politics illustration 1">
  <rect width="800" height="450" fill="#1f3a5f"/>
  <rect x="0" y="330" width="800" height="120" fill="#000" opacity=".12"/>
  <polygon points="400,90 600,170 200,170" fill="#fff" opacity=".9"/>
     <rect x="215" y="190" width="40" height="150" fill="#fff" opacity=".85"/><rect x="300" y="190" width="40" height="150" fill="#fff" opacity=".85"/>
     <rect x="460" y="190" width="40" height="150" fill="#fff" opacity=".85"/><rect x="545" y="190" width="40" height="150" fill="#fff" opacity=".85"/>
     <rect x="180" y="350" width="440" height="24" fill="#fff" opacity=".9"/>
</svg>
